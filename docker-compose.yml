version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: citymind-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - citymind_db_data:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - citymind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citymind-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - citymind-network

networks:
  citymind-network:
    driver: bridge

volumes:
  citymind_db_data:
